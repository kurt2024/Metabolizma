name: Android APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Node.js Ortamını Kur
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Java (JDK 17) Ortamını Kur
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Proje Dosyalarını Kontrol Et ve Hazirla
      run: |
        echo "Mevcut dosya yapısı:"
        ls -la
        mkdir -p www
        if [ -f index.html ]; then
          cp index.html www/index.html
        fi
        ls -la www

    - name: Bağımlılıkları Yükle
      run: npm install --legacy-peer-deps

    - name: Capacitor Android Modülünü Ekle ve Senkronize Et
      run: |
        # capacitor.config.json dosyasını okuyarak başlatır ve android platformunu ekler
        npx cap add android
        npx cap sync android

    - name: Gradle ile Debug APK Derle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Derlenen APK Dosyasını Kaydet ve İndirilebilir Yap
      uses: actions/upload-artifact@v4
      with:
        name: metabolizma-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
